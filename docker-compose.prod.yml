version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: japanese_learning_db_prod
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_DATABASE: japanese_learning_db
    # Bind to localhost to prevent public internet exposure
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: japanese_learning_redis_prod
    # Start Redis with password authentication for production security
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    # Bind to localhost to prevent public internet exposure
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: japanese_learning_api_prod
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Using db container name
      - DB_URL=jdbc:mariadb://db:3306/japanese_learning_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis Config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Admin Setup Config
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # JWT Secrets
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Rate Limiting configuration (defaults to FAIL_CLOSED in prod)
      - APP_RATE_LIMIT_REDIS_FAILURE_POLICY=${APP_RATE_LIMIT_REDIS_FAILURE_POLICY:-FAIL_CLOSED}
      # CORS configuration (explicit production origins required, no localhost fallback)
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      # Cookie configuration (SameSite=None requires Secure=true)
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE:-true}
      - APP_COOKIE_SAME_SITE=${APP_COOKIE_SAME_SITE:-Strict}
      # Media URL Security (comma-separated allowed domains, e.g. s3.amazonaws.com)
      - APP_MEDIA_TRUSTED_DOMAINS=${APP_MEDIA_TRUSTED_DOMAINS:-}
      # Payment Simulation (disabled by default in prod)
      - APP_PAYMENT_SIMULATION_ENABLED=${APP_PAYMENT_SIMULATION_ENABLED:-false}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: mariadb:10.11
    profiles:
      - backup
    container_name: japanese_learning_backup_runner
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=japanese_learning_db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_DIR=/var/backups/japanese-learning-db
      - RETENTION_DAYS_DAILY=${RETENTION_DAYS_DAILY:-7}
      - RETENTION_WEEKS=${RETENTION_WEEKS:-4}
      - RETENTION_MONTHS=${RETENTION_MONTHS:-12}
      - EXTERNAL_STORAGE_TYPE=${EXTERNAL_STORAGE_TYPE:-none}
      - EXTERNAL_STORAGE_DEST=${EXTERNAL_STORAGE_DEST:-}
      - BACKUP_NOTIFICATION_WEBHOOK=${BACKUP_NOTIFICATION_WEBHOOK:-}
    volumes:
      - ./scripts/backup:/scripts/backup:ro
      - db_backups_prod:/var/backups/japanese-learning-db
    networks:
      - app-network-prod
    entrypoint: ["/bin/bash", "/scripts/backup/backup.sh"]

volumes:
  db_data_prod:
  redis_data_prod:
  db_backups_prod:

networks:
  app-network-prod:
    driver: bridge

