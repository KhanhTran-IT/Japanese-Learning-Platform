version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: japanese_learning_db_prod
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
      MARIADB_DATABASE: japanese_learning_db
    ports:
      - "3306:3306"
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - app-network-prod
    restart: always

  redis:
    image: redis:7-alpine
    container_name: japanese_learning_redis_prod
    # Start Redis with password authentication for production security
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - app-network-prod
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: japanese_learning_api_prod
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Using db container name
      - DB_URL=jdbc:mariadb://db:3306/japanese_learning_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis Config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Rate Limiting configuration
      - APP_RATE_LIMIT_REDIS_FAILURE_POLICY=FAIL_CLOSED
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    networks:
      - app-network-prod
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data_prod:
  redis_data_prod:

networks:
  app-network-prod:
    driver: bridge
