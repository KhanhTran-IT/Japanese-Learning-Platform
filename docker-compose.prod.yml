version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: japanese_learning_db_prod
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-${DB_PASSWORD}}"
      MARIADB_DATABASE: japanese_learning_db
      MARIADB_USER: "${DB_USER:-japanese_learning_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
    # Reduce host exposure: communicate internally over app-network-prod without publishing to host
    expose:
      - "3306"
    volumes:
      - db_data_prod:/var/lib/mysql
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: japanese_learning_redis_prod
    # Start Redis with password authentication for production security
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    # Reduce host exposure: communicate internally over app-network-prod without publishing to host
    expose:
      - "6379"
    volumes:
      - redis_data_prod:/data
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: japanese_learning_api_prod
    env_file:
      - .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Using db container name and least-privilege application database user
      - DB_URL=jdbc:mariadb://db:3306/japanese_learning_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
      - DB_USERNAME=${DB_USER:-japanese_learning_user}
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis Config
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Admin Setup Config
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # JWT Secrets
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Rate Limiting configuration (defaults to FAIL_CLOSED in prod)
      - APP_RATE_LIMIT_REDIS_FAILURE_POLICY=${APP_RATE_LIMIT_REDIS_FAILURE_POLICY:-FAIL_CLOSED}
      # CORS configuration (explicit production origins required, no localhost fallback)
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      # Cookie configuration (SameSite=None requires Secure=true)
      - APP_COOKIE_SECURE=${APP_COOKIE_SECURE:-true}
      - APP_COOKIE_SAME_SITE=${APP_COOKIE_SAME_SITE:-Strict}
      # Media URL Security (comma-separated allowed domains, e.g. s3.amazonaws.com)
      - APP_MEDIA_TRUSTED_DOMAINS=${APP_MEDIA_TRUSTED_DOMAINS:-}
      # Payment Simulation (disabled by default in prod)
      - APP_PAYMENT_SIMULATION_ENABLED=${APP_PAYMENT_SIMULATION_ENABLED:-false}
    # Reduce host exposure: Bind to localhost so public requests must go through reverse proxy (e.g. Caddy/Nginx)
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: mariadb:10.11
    profiles:
      - backup
    container_name: japanese_learning_backup_runner
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=japanese_learning_db
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
      - BACKUP_DIR=/var/backups/japanese-learning-db
      - RETENTION_DAYS_DAILY=${RETENTION_DAYS_DAILY:-7}
      - RETENTION_WEEKS=${RETENTION_WEEKS:-4}
      - RETENTION_MONTHS=${RETENTION_MONTHS:-12}
      - EXTERNAL_STORAGE_TYPE=${EXTERNAL_STORAGE_TYPE:-none}
      - EXTERNAL_STORAGE_DEST=${EXTERNAL_STORAGE_DEST:-}
      - BACKUP_NOTIFICATION_WEBHOOK=${BACKUP_NOTIFICATION_WEBHOOK:-}
    volumes:
      - ./scripts/backup:/scripts/backup:ro
      - db_backups_prod:/var/backups/japanese-learning-db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network-prod
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    entrypoint: ["/bin/bash", "/scripts/backup/backup.sh"]

volumes:
  db_data_prod:
  redis_data_prod:
  db_backups_prod:

networks:
  app-network-prod:
    driver: bridge
