spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# Swagger disabled in prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# App custom properties
app:
  admin:
    password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:Strict}
  rate-limit:
    redis-failure-policy: ${APP_RATE_LIMIT_REDIS_FAILURE_POLICY:FAIL_CLOSED}
  media:
    require-https: true
    trusted-domains: ${APP_MEDIA_TRUSTED_DOMAINS:}
  payment:
    simulation-enabled: ${APP_PAYMENT_SIMULATION_ENABLED:false}

jwt:
  secret:
    access: ${JWT_ACCESS_SECRET}
    refresh: ${JWT_REFRESH_SECRET}

