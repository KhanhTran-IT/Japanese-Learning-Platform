server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: japanese-learning-api
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

# Common App properties
app:
  admin:
    email: admin@example.com
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  backend-url: http://localhost:8080
  cookie:
    secure: false
    # SameSite guidance:
    # Lax: Default. Good for same-site deployments (*.example.com).
    # None: Required for cross-site (app.com calling api.com). MUST have secure: true.
    # Strict: Most secure, blocks cross-site navigation requests.
    same-site: Lax
  rate-limit:
    login:
      max-attempts-per-ip: 20
      max-attempts-per-email: 10
      window-minutes: 15
    refresh:
      max-attempts-per-ip: 30
      window-minutes: 15

# Common JWT properties
jwt:
  expiration:
    access: 900000 # 15 minutes in ms
    refresh: 604800000 # 7 days in ms
