spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  health:
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  monitoring:
    secret: test-monitoring-secret-key-32chars-min!
  seeder:
    enabled: false
  admin:
    email: admin@example.com
    password: Password@123
  cors:
    allowed-origins: http://localhost:5173
  backend-url: http://localhost:8080
  cookie:
    secure: false
    same-site: Lax
  rate-limit:
    login:
      max-attempts-per-ip: 20
      max-attempts-per-email: 10
      window-minutes: 15
    refresh:
      max-attempts-per-ip: 30
      window-minutes: 15
  payment:
    simulation-enabled: true
    retention:
      raw-payload-days: 90
      cron: "0 0 3 * * ?"
    vnpay:
      tmn-code: DEMOTMN1
      hash-secret: DEMOHASHSECRET1234567890ABCDEF
      pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      return-url: http://localhost:5173/student/checkout/vnpay-return

jwt:
  secret:
    access: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    refresh: 50645367566B5970337336763979244226452948404D635166546A576E5A7134
  expiration:
    access: 900000
    refresh: 604800000
